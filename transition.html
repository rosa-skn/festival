<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transition</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .fullscreen-gif {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 999;
    }
  </style>
</head>
<body>

  <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzRvMG1qeWU1NWVjYnhidmZqZW5rZ2ExdTVocGl1d24zdW13eHMyOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xUOxeY2Bu6LZuwedKo/giphy.gif" alt="Transition" class="fullscreen-gif">

  <script>
    setTimeout(() => {
      window.location.href = "index.html";
    }, 3000); // Duration before redirect (in ms)
  </script>

</body>
</html>
